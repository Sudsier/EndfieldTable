name: table-extract

# 触发方式：
#   1. repository_dispatch（外部 HTTP 每 5 分钟触发，例如 cron-job.org）
#        POST https://api.github.com/repos/{owner}/{repo}/dispatches
#        Authorization: Bearer {PAT}
#        Content-Type: application/json
#        {"event_type": "table-extract"}
#        （可选 client_payload: {"region": "cn", "force": "true"}）
#   2. workflow_dispatch（手动触发，仓库 Actions 页面按钮）

on:
  workflow_dispatch:
    inputs:
      region:
        description: '渠道: cn=国服 / os=国际服'
        required: false
        default: cn
      force:
        description: '强制重跑（绕过 archive 已存在检查）: true / false'
        required: false
        default: 'false'
  repository_dispatch:
    types:
      - table-extract

# 并发控制：同一时刻只允许一个 table-extract 实例运行。
# 若 cron 触发时上一个还没跑完，新实例会排队等待（cancel-in-progress: false 不打断已有任务）。
concurrency:
  group: table-extract
  cancel-in-progress: false

env:
  ARCHIVE_BRANCH: archive
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  extract:
    name: 提取并归档 Table
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码与预编译工具 (main)
        uses: actions/checkout@v4
        with:
          ref: main

      # 无需安装 Node / .NET：
      #   - run.exe 为 pkg 打包的单文件可执行（内置 Node 18 运行时）
      #   - tools/AnimeStudio.CLI/AnimeStudio.CLI.zip 为自包含解包工具（内置 .NET 运行时，
      #     首次运行时由 run.exe 自动解压为 AnimeStudio.CLI.exe）

      - name: 解析触发参数 (region / force)
        id: cfg
        shell: pwsh
        run: |
          $region = ''
          $force = ''
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $region = '${{ github.event.inputs.region }}'
            $force = '${{ github.event.inputs.force }}'
          } elseif ('${{ github.event_name }}' -eq 'repository_dispatch') {
            $region = '${{ github.event.client_payload.region }}'
            $force = '${{ github.event.client_payload.force }}'
          }
          $region = [string]$region
          $force = [string]$force
          if ($region -eq '' -or $region -eq 'null') { $region = 'cn' }
          $force = if ($force.ToLowerInvariant() -eq 'true') { 'true' } else { 'false' }
          Write-Host "region=$region force=$force"
          "region=$region" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "force=$force" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 手动准备 archive-data git 工作区（不用 actions/checkout，避免 archive 分支不存在时直接失败）：
      #   archive 分支已存在 -> 检出其最新内容
      #   archive 分支不存在 -> 创建 orphan 分支，首次推送时自动创建远程分支
      - name: 准备 archive-data 工作区
        shell: pwsh
        run: |
          $repo = '${{ github.repository }}'
          $remote = "https://x-access-token:$env:GH_TOKEN@github.com/$repo.git"
          New-Item -ItemType Directory -Force -Path archive-data | Out-Null
          Push-Location archive-data
          git init -q
          git remote add origin $remote
          git fetch -q --depth=1 origin $env:ARCHIVE_BRANCH
          if ($LASTEXITCODE -eq 0) {
            git checkout -q -B $env:ARCHIVE_BRANCH FETCH_HEAD
            Write-Host "archive 分支已存在，已检出其最新内容"
          } else {
            git checkout -q --orphan $env:ARCHIVE_BRANCH
            git rm -rf -q . --ignore-unmatch 2>$null
            Write-Host "archive 分支不存在，已创建 orphan 分支（首次推送时自动建远程分支）"
          }
          Pop-Location

      # run.exe / tools/ 均位于仓库根目录（workflow 文件夹内容直接上传到根目录，不建 workflow/ 子目录）
      - name: 运行提取流程 (获取 -> 下载 -> 处理 -> 归档 -> 生成活动简化 JSON)
        shell: pwsh
        run: |
          Write-Host '当前仓库根目录:'
          Get-ChildItem -Force | Select-Object -ExpandProperty Name
          if (-not (Test-Path 'run.exe')) { throw '仓库根目录缺少 run.exe（请确认已上传 workflow 文件夹内容到根目录）' }
          if (-not (Test-Path 'tools/AnimeStudio.CLI/AnimeStudio.CLI.zip')) { throw '仓库根目录缺少 tools/AnimeStudio.CLI/AnimeStudio.CLI.zip' }
          $args = @('--region', "${{ steps.cfg.outputs.region }}", '--archive-dir', './archive-data')
          if ("${{ steps.cfg.outputs.force }}" -eq 'true') { $args += '--force' }
          & .\run.exe @args

      - name: 提交并推送 archive 分支
        shell: pwsh
        run: |
          Push-Location archive-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # table/ 为新归档版本目录；activity-summary.json 为活动简化 JSON（每次更新覆盖）
          git add table activity-summary.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host '无变更（版本已归档或本次无更新），跳过推送'
          } else {
            git commit -q -m "table: ${{ steps.cfg.outputs.region }} $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            git push -q origin $env:ARCHIVE_BRANCH
            Write-Host '已推送 archive 分支'
          }
          Pop-Location
